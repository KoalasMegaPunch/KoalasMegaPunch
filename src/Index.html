<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Jua&display=swap">
<style>
:root {
  --bg: #f5f6fb;
  --bg-grad: radial-gradient(1200px 500px at 100% -10%, #e9e5ff 0%, rgba(233,229,255,0) 60%), radial-gradient(900px 420px at -10% 0%, #dff1ff 0%, rgba(223,241,255,0) 55%), #f5f6fb;
  --card: #ffffff;
  --text: #191b2e;
  --muted: #7a7f98;
  --line: #e8e9f3;
  --field: #f3f4fa;
  --primary: #5b4cf0;
  --primary-2: #8b5cf6;
  --grad: linear-gradient(135deg, #5b4cf0 0%, #8b5cf6 100%);
  --primary-soft: #efedff;
  --primary-text: #ffffff;
  --zoom: #0b5cff;
  --zoom-grad: linear-gradient(135deg, #0b5cff 0%, #2d8cff 55%, #45b4ff 100%);
  --zoom-soft: #e8f0ff;
  --ok: #0f9f6e;
  --ok-soft: #e3f7ef;
  --warn: #e0601b;
  --warn-soft: #fff2e8;
  --danger: #e5484d;
  --mine: #0b5cff;
  --mine-soft: #e8f0ff;
  --shadow: 0 1px 2px rgba(25, 27, 46, .04), 0 8px 24px rgba(25, 27, 46, .06);
  --shadow-lg: 0 12px 32px rgba(25, 27, 46, .12);
  --radius: 20px;
  --nav-h: 66px;
  --display: "Jua", "IBM Plex Sans KR", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1020;
    --bg-grad: radial-gradient(1200px 500px at 100% -10%, #261f55 0%, rgba(38,31,85,0) 60%), radial-gradient(900px 420px at -10% 0%, #0f2a45 0%, rgba(15,42,69,0) 55%), #0f1020;
    --card: #1a1b2e;
    --text: #eef0fb;
    --muted: #9a9fbb;
    --line: #2a2c45;
    --field: #22243a;
    --primary: #a99bff;
    --primary-soft: #2a2655;
    --zoom-soft: #13284d;
    --ok: #3ddc97; --ok-soft: #123326;
    --warn: #ff9a5c; --warn-soft: #3a2415;
    --danger: #ff6b6f;
    --mine: #6aa8ff; --mine-soft: #13284d;
    --shadow: 0 1px 0 rgba(255,255,255,.03);
    --shadow-lg: 0 12px 32px rgba(0,0,0,.5);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
body {
  background: var(--bg-grad); background-attachment: fixed; min-height: 100vh;
  font-family: "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  font-size: 15px; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; letter-spacing: -.1px;
}
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--primary); }
.hidden { display: none !important; }

/* ---------- layout ---------- */
#app { max-width: 640px; margin: 0 auto; min-height: 100vh; }
.topbar { padding: calc(env(safe-area-inset-top) + 16px) 20px 6px; }
.brand-row { display: flex; align-items: center; gap: 10px; }
.brand { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; font-weight: 700; font-size: 14px; color: var(--muted); }
.psi { font-family: "Times New Roman", "Noto Serif", Georgia, serif; font-weight: 700; line-height: 1; padding-top: 1px; }
.brand .mini-logo { width: 26px; height: 26px; border-radius: 8px; background: var(--grad); color: #fff; display: grid; place-items: center; font-size: 15px; flex: none; }
.who { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; background: var(--card); padding: 4px 12px 4px 4px; border-radius: 999px; box-shadow: var(--shadow); }
.who .avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--grad); color: #fff; display: grid; place-items: center; font-size: 12px; }
.who.admin .avatar { background: linear-gradient(135deg, #f59e0b, #ef4444); }
.page-title { font-family: var(--display); font-size: 30px; font-weight: 400; margin: 18px 0 0; letter-spacing: -.5px; line-height: 1.25; }
.page-sub { color: var(--muted); font-size: 14px; margin: 2px 0 8px; }
main { padding: 8px 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 36px); }
.nav {
  position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 10px); z-index: 20;
  max-width: 616px; margin: 0 auto;
  background: rgba(255, 255, 255, .86); -webkit-backdrop-filter: blur(18px) saturate(1.6); backdrop-filter: blur(18px) saturate(1.6);
  border-radius: 24px; box-shadow: var(--shadow-lg); border: 1px solid rgba(255,255,255,.6);
}
@media (prefers-color-scheme: dark) { .nav { background: rgba(26, 27, 46, .86); border-color: rgba(255,255,255,.06); } }
.nav-inner { display: flex; height: var(--nav-h); padding: 0 4px; }
.nav button {
  flex: 1; min-width: 0; border: 0; background: none; cursor: pointer; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 11px; font-weight: 700; position: relative; white-space: nowrap; letter-spacing: -.3px;
}
.nav button .ic { width: 44px; height: 30px; border-radius: 12px; display: grid; place-items: center; transition: background .2s; }
.nav button svg { width: 22px; height: 22px; }
.nav button.on { color: var(--primary); }
.nav button.on .ic { background: var(--primary-soft); }
.nav .dot {
  position: absolute; top: 6px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px;
  background: var(--danger); color: #fff; font-size: 11px; border-radius: 9px; line-height: 18px; border: 2px solid var(--card); box-sizing: content-box;
}

/* ---------- common ---------- */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 12px; }
.card h3 { margin: 0 0 6px; font-size: 16.5px; font-weight: 700; letter-spacing: -.3px; }
.section-title { font-size: 14px; font-weight: 700; color: var(--text); margin: 22px 4px 10px; display: flex; align-items: center; gap: 8px; }
.section-title .grow { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.pre { white-space: pre-wrap; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.btn {
  border: 0; border-radius: 14px; padding: 12px 18px; font-weight: 700; cursor: pointer;
  background: var(--grad); color: var(--primary-text); display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 46px; box-shadow: 0 6px 16px rgba(91, 76, 240, .25); transition: transform .1s;
}
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.block { width: 100%; }
.btn.ghost { background: var(--primary-soft); color: var(--primary); box-shadow: none; }
.btn.line { background: var(--field); color: var(--text); box-shadow: none; }
.btn.danger { background: transparent; border: 1.5px solid var(--line); color: var(--danger); box-shadow: none; }
.btn.zoom { background: #fff; color: var(--zoom); box-shadow: 0 6px 16px rgba(0, 40, 120, .2); }
.btn.zoom-solid { background: var(--zoom-grad); color: #fff; box-shadow: 0 6px 16px rgba(11, 92, 255, .25); }
.btn.sm { padding: 6px 14px; min-height: 34px; font-size: 13px; border-radius: 11px; }
.link-btn { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 13px; padding: 8px; }
.badge { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.wait { background: var(--warn-soft); color: var(--warn); }
.badge.mine { background: var(--mine-soft); color: var(--mine); }
.badge.pri { background: var(--primary-soft); color: var(--primary); }
.empty { text-align: center; color: var(--muted); padding: 40px 16px; }
.empty .big { font-size: 40px; margin-bottom: 8px; }
.notice { background: var(--card); box-shadow: var(--shadow); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; display: flex; gap: 10px; border-left: 4px solid var(--primary); }
.notice b { color: var(--primary); flex: none; }

/* chips */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 12px; scrollbar-width: none; margin: 0 -16px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 0; background: var(--card); color: var(--muted); box-shadow: var(--shadow);
  border-radius: 999px; padding: 9px 16px; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center;
}
.chip.on { background: var(--text); color: var(--bg); }
.seg { display: flex; background: var(--field); border-radius: 14px; padding: 4px; margin-bottom: 14px; }
.seg button { flex: 1; border: 0; background: none; padding: 9px 4px; border-radius: 11px; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--card); color: var(--text); box-shadow: var(--shadow); }

/* forms */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
.field .hint { font-size: 12px; color: var(--muted); margin-top: 5px; }
.input, textarea.input, select.input {
  width: 100%; border: 1.5px solid transparent; background: var(--field); border-radius: 14px;
  padding: 13px 15px; font-size: 16px; outline: none; transition: border-color .15s, background .15s;
}
.input:focus { border-color: var(--primary); background: var(--card); }
textarea.input { min-height: 110px; resize: vertical; }
.lock-note { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--muted); background: var(--field); border-radius: 14px; padding: 10px 12px; margin-bottom: 14px; }

/* auth */
.auth { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 28px 22px calc(env(safe-area-inset-bottom) + 24px); max-width: 440px; margin: 0 auto; }
.auth .logo { width: 64px; height: 64px; border-radius: 20px; background: var(--grad); color: #fff; display: grid; place-items: center; font-size: 32px; margin-bottom: 18px; box-shadow: 0 10px 24px rgba(91, 76, 240, .35); }
.auth h1 { font-family: var(--display); font-weight: 400; font-size: 34px; margin: 0 0 6px; letter-spacing: -.5px; line-height: 1.2; }
.auth .sub { color: var(--muted); margin: 0 0 24px; }
.auth form { background: var(--card); border-radius: 24px; padding: 20px; box-shadow: var(--shadow); }

/* lessons */
.week-select { margin-bottom: 12px; }
.lesson h3 { font-size: 18px; }
.lesson .block { margin-top: 16px; }
.lesson .block-title { font-size: 12.5px; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
.lesson .hw { background: var(--warn-soft); border-radius: 16px; padding: 12px 14px; }
.lesson .hw .block-title { color: var(--warn); }
.video {
  display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text);
  border-radius: 16px; padding: 10px 12px; margin-bottom: 8px; background: var(--field);
}
.video .play { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #ff4d4d, #e11d48); color: #fff; display: grid; place-items: center; flex: none; }
.video .t { font-weight: 700; }
.video .u { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.admin-bar { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }

/* zoom clinic */
.zoom-hero { background: var(--zoom-grad); color: #fff; border-radius: 24px; padding: 20px; margin-bottom: 14px; position: relative; overflow: hidden; box-shadow: 0 12px 28px rgba(11, 92, 255, .28); }
.zoom-hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,.12); }
.zoom-hero .zt { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 24px; }
.zoom-hero .zt .cam { width: 38px; height: 38px; border-radius: 12px; background: rgba(255,255,255,.2); display: grid; place-items: center; }
.zoom-hero p { margin: 8px 0 0; font-size: 13.5px; opacity: .92; position: relative; z-index: 1; }
.zoom-hero .btn { margin-top: 14px; position: relative; z-index: 1; }
.zoom-info { background: rgba(255,255,255,.16); border-radius: 12px; padding: 8px 12px; margin-top: 10px; font-size: 13px; position: relative; z-index: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--muted); margin: 4px 4px 12px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 5px; vertical-align: -1px; }
.day h3 { display: flex; align-items: baseline; gap: 8px; font-size: 17px; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(94px, 1fr)); gap: 8px; margin-top: 12px; }
.slot {
  border: 1.5px solid transparent; border-radius: 16px; padding: 10px 6px; text-align: center; cursor: pointer;
  background: var(--field); min-height: 64px; display: flex; flex-direction: column; justify-content: center; gap: 1px; transition: transform .1s;
}
.slot:active { transform: scale(.97); }
.slot .h { font-weight: 700; font-size: 16px; }
.slot .s { font-size: 11.5px; color: var(--muted); }
.slot.free { border-color: rgba(11, 92, 255, .35); background: var(--zoom-soft); }
.slot.free .s { color: var(--zoom); font-weight: 700; }
.slot.mine { background: var(--zoom-grad); color: #fff; box-shadow: 0 6px 14px rgba(11, 92, 255, .3); }
.slot.mine .s { color: #fff; font-weight: 700; }
.slot.full, .slot.past { color: var(--muted); cursor: default; opacity: .7; }
.slot.past .h { text-decoration: line-through; }
.slot.admin-has { border-color: var(--zoom); background: var(--zoom-soft); }
.slot .cls { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
.slot .names { font-size: 11.5px; font-weight: 700; color: var(--zoom); }

/* qna */
.q { cursor: pointer; }
.q .meta { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.q .meta .date { margin-left: auto; font-size: 12px; color: var(--muted); }
.q h3 { font-size: 16px; margin: 0; }
.q .body { margin-top: 10px; }
.answer { margin-top: 12px; background: var(--primary-soft); border-radius: 16px; padding: 12px 14px; }
.answer .who-a { font-size: 12.5px; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
.answer textarea.input { background: var(--card); }
.faq-item summary { list-style: none; cursor: pointer; display: flex; gap: 10px; font-weight: 700; }
.faq-item summary::-webkit-details-marker { display: none; }
.faq-item summary .qmark { color: #fff; background: var(--grad); border-radius: 8px; font-size: 12px; padding: 2px 7px; height: fit-content; flex: none; }
.faq-item .a { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); display: flex; gap: 10px; }
.faq-item .a .amark { color: var(--ok); font-weight: 800; }
.fab {
  position: fixed; right: max(20px, calc(50% - 300px)); bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px); z-index: 15;
  border-radius: 999px; padding: 14px 22px; box-shadow: 0 10px 24px rgba(91, 76, 240, .4);
}
.notice-card.pinned { box-shadow: 0 0 0 2px var(--primary), var(--shadow); }
.notice-card h3 { margin-bottom: 8px; }

/* list rows (admin) */
.list-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.list-row:last-child { border-bottom: 0; }
.icon-btn { border: 0; background: var(--field); border-radius: 11px; width: 36px; height: 36px; display: grid; place-items: center; cursor: pointer; flex: none; color: var(--text); }
.icon-btn:disabled { opacity: .35; }
.kv { display: grid; grid-template-columns: 84px 1fr; gap: 8px 10px; margin: 0; }
.kv dt { color: var(--muted); font-size: 13.5px; }
.kv dd { margin: 0; font-weight: 600; }
.profile-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.profile-head .big-avatar { width: 56px; height: 56px; border-radius: 18px; background: var(--grad); color: #fff; display: grid; place-items: center; font-family: var(--display); font-size: 26px; }

/* sheet (modal) */
.backdrop { position: fixed; inset: 0; background: rgba(15, 16, 32, .45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
.sheet {
  background: var(--card); width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto;
  border-radius: 28px 28px 0 0; padding: 8px 20px calc(env(safe-area-inset-bottom) + 20px); animation: up .22s ease-out;
}
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 14px; }
.sheet h2 { font-family: var(--display); font-weight: 400; font-size: 23px; margin: 0 0 16px; }
.sheet .actions { display: flex; gap: 8px; margin-top: 8px; }
.sheet .actions .btn { flex: 1; }
@keyframes up { from { transform: translateY(40px); opacity: .5; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* toast & loader */
#toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 14px); transform: translateX(-50%); z-index: 100; pointer-events: none; }
#toast div { background: rgba(25, 27, 46, .92); color: #fff; padding: 11px 18px; border-radius: 14px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow-lg); animation: up .2s; max-width: 86vw; text-align: center; }
#toast div.err { background: var(--danger); }
.spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; margin: 40px auto; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app"><div class="spinner"></div></div>
<div id="toast"></div>

<script>
/* =========================================================
 * 서버 호출
 * ======================================================= */
const STORE_KEY = 'classapp.v1';
const S = { token: null, me: null, subjects: [], subjectId: null, tab: 'notice', appName: '', notice: '', qnaMode: 'board', qFilter: 'all', unanswered: 0, sheetUrl: '', noticeStamps: [] };

function loadStore() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch (e) { return {}; } }
function saveStore(patch) { try { localStorage.setItem(STORE_KEY, JSON.stringify(Object.assign(loadStore(), patch))); } catch (e) {} }

/* 읽기 요청 캐시: 한 번 불러온 화면은 탭을 오갈 때 바로 보여줍니다.
 * - CACHE_TTL 동안 재사용, 무언가를 저장/삭제하면 캐시 전체를 비웁니다.
 * - 이미 보고 있는 탭을 다시 누르면 새로 불러옵니다. */
const CACHE_TTL = 60 * 1000;
// bookingSlots(Clinic 시간표)는 항상 최신이어야 하므로 캐시하지 않음
const READ_ACTIONS = ['lessonsList', 'noticesList', 'questionsList', 'faqList', 'myInfo', 'studentsList'];
const READ_CACHE = new Map();
function call(action, payload) {
  if (READ_ACTIONS.indexOf(action) < 0) {
    return rawCall(action, payload).then(r => { READ_CACHE.clear(); return r; }, e => { READ_CACHE.clear(); throw e; });
  }
  const key = action + JSON.stringify(payload || {});
  const hit = READ_CACHE.get(key);
  if (hit && Date.now() - hit.t < CACHE_TTL) return hit.p;
  const p = rawCall(action, payload);
  READ_CACHE.set(key, { t: Date.now(), p });
  p.catch(() => READ_CACHE.delete(key));
  return p;
}

/** 첫 화면을 보는 동안 다른 탭 데이터를 미리 받아 둡니다. */
function prefetch() {
  const sid = S.subjectId;
  const list = [['noticesList', { subjectId: sid }], ['lessonsList', { subjectId: sid }], ['questionsList', { subjectId: sid }]];
  if (!isAdmin()) list.push(['myInfo']);
  setTimeout(() => list.forEach(([a, p]) => { if (sid) call(a, p).catch(() => {}); }), 300);
}

function rawCall(action, payload) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(err => {
        const msg = String((err && err.message) || err || '오류가 났어요.').replace(/^(Error|Exception|ScriptError):\s*/i, '');
        if (msg.indexOf('AUTH_REQUIRED') >= 0) { logout(true); reject(new Error('다시 로그인해 주세요.')); return; }
        reject(new Error(msg));
      })
      .api(action, S.token, payload || {});
  });
}

/* =========================================================
 * DOM 도우미
 * ======================================================= */
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) {
    for (const k in props) {
      const v = props[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'style') e.style.cssText = v;
      else if (k === 'value') e.value = v;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
  }
  append(e, kids);
  return e;
}
function append(parent, kids) {
  [].concat(kids).flat(Infinity).forEach(k => {
    if (k === null || k === undefined || k === false) return;
    parent.append(k.nodeType ? k : document.createTextNode(String(k)));
  });
  return parent;
}

/** 텍스트 속 URL 을 안전하게 링크로 바꿔 줍니다. */
function richText(text, cls) {
  const box = el('div', { class: 'pre ' + (cls || '') });
  const re = /(https?:\/\/[^\s<>"']+)/g;
  let last = 0, m;
  const s = String(text || '');
  while ((m = re.exec(s))) {
    box.append(document.createTextNode(s.slice(last, m.index)));
    box.append(el('a', { href: m[1], target: '_blank', rel: 'noopener' }, m[1]));
    last = m.index + m[1].length;
  }
  box.append(document.createTextNode(s.slice(last)));
  return box;
}

/** 버튼을 누르는 동안 비활성화하고 오류는 토스트로 보여줍니다. */
async function busy(btn, fn) {
  const label = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '처리 중…'; }
  try { return await fn(); }
  catch (e) { toast(e.message, true); throw e; }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = label; } }
}

function openSheet(title, body, actions) {
  const back = el('div', { class: 'backdrop' });
  const sheet = el('div', { class: 'sheet' }, el('div', { class: 'grab' }), el('h2', null, title), body);
  if (actions && actions.length) sheet.append(el('div', { class: 'actions' }, actions));
  back.append(sheet);
  const close = () => back.remove();
  back.addEventListener('click', e => { if (e.target === back) close(); });
  document.body.append(back);
  const first = sheet.querySelector('input, textarea');
  if (first && window.innerWidth > 700) first.focus();
  return close;
}

function confirmSheet(title, message, okLabel, danger) {
  return new Promise(resolve => {
    let close;
    const ok = el('button', { class: 'btn' + (danger ? ' danger' : ''), onclick: () => { close(); resolve(true); } }, okLabel || '확인');
    const cancel = el('button', { class: 'btn line', onclick: () => { close(); resolve(false); } }, '취소');
    close = openSheet(title, message ? el('p', { class: 'muted pre', style: 'margin-top:0' }, message) : null, [cancel, ok]);
  });
}

function classChooser(classes, selected) {
  const chosen = new Set(selected || []);
  const box = el('div', { class: 'row wrap', style: 'gap:8px' });
  classes.forEach(c => {
    const b = el('button', { type: 'button', class: 'chip' + (chosen.has(c.id) ? ' on' : ''), onclick: () => {
      if (chosen.has(c.id)) chosen.delete(c.id); else chosen.add(c.id);
      b.classList.toggle('on', chosen.has(c.id));
    } }, c.name);
    box.append(b);
  });
  box.value = () => Array.from(chosen);
  return box;
}

async function viewLessons(view, keepWeek) {
  clear(view);
  if (S.notice) view.append(el('div', { class: 'notice' }, el('b', null, '공지'), richText(S.notice)));
  view.append(subjectChips(() => viewLessons(view)));
  if (!S.subjectId) return;
  if (isAdmin()) view.append(el('button', { class: 'btn ghost block', style: 'margin-bottom:12px', onclick: () => lessonForm(null, () => viewLessons(view)) }, '+ 수업 올리기'));
  const box = el('div', null, loader());
  view.append(box);
  let d;
  try { d = await call('lessonsList', { subjectId: S.subjectId }); }
  catch (e) { clear(box).append(emptyState('⚠️', e.message)); return; }
  clear(box);
  if (!d.lessons.length) { box.append(emptyState('📚', '아직 올라온 수업이 없어요.')); return; }

  const weeks = d.weeks;
  let week = keepWeek && weeks.some(w => w.week === keepWeek) ? keepWeek
    : (weeks.find(w => w.week === d.thisWeek) || weeks.find(w => w.week < d.thisWeek) || weeks[weeks.length - 1]).week;
  const sel = el('select', { class: 'input', onchange: () => { week = sel.value; draw(); } },
    weeks.map(w => el('option', { value: w.week }, w.label)));
  sel.value = week;
  const list = el('div');
  box.append(el('div', { class: 'week-select' }, sel), list);

  function draw() {
    clear(list);
    d.lessons.filter(l => l.week === week).forEach(l => list.append(lessonCard(l, () => viewLessons(view, week))));
  }
  draw();
}

    field('과목', subj),

    field('제목', title),
    field('수업 내용', content),
    field('수업 영상 링크', videos, '한 줄에 하나씩. "제목 | 주소" 형식으로 쓰면 제목이 붙어요.'),
    field('숙제', hw)),
    [el('button', { class: 'btn line', onclick: () => close() }, '닫기'), save]);

    refresh();
  }));
}

/* =========================================================
 * 반별 공지 탭
 * ======================================================= */
function seenKey() { return 'seenNotices_' + (S.me ? S.me.id : ''); }
function seenNotices() { const v = loadStore()[seenKey()]; return Array.isArray(v) ? v : []; }
function unreadNotices(subjectId) {
  const seen = seenNotices();
  return S.noticeStamps.filter(n => seen.indexOf(n.id) < 0 && (!subjectId || !n.subjectId || n.subjectId === subjectId));
}
function markNoticesSeen(ids) {
  const seen = seenNotices();
  ids.forEach(id => { if (seen.indexOf(id) < 0) seen.push(id); });
  saveStore({ [seenKey()]: seen.slice(-500) });
  const dot = document.querySelector('nav [data-tab=notice] .dot');
  const left = unreadNotices().length;
  if (dot) { if (left) dot.textContent = left; else dot.remove(); }
}

async function viewNotices(view) {
  clear(view);
  const subs = visibleSubjects();
  const chips = subjectChips(() => viewNotices(view));
  // 반 칩에 새 공지 개수 표시 (학생)
  if (!isAdmin()) chips.querySelectorAll('.chip').forEach((c, i) => {
    const n = subs[i] ? unreadNotices(subs[i].id).filter(x => x.subjectId).length : 0;
    if (n) c.append(el('span', { class: 'badge wait', style: 'margin-left:6px;padding:0 6px' }, n));
  });
  view.append(chips);
  if (!S.subjectId) return;
  if (isAdmin()) view.append(el('button', { class: 'btn ghost block', style: 'margin-bottom:12px', onclick: () => noticeForm(null, () => viewNotices(view)) }, '+ 공지 쓰기'));
  const box = el('div', null, loader());
  view.append(box);
  let list;
  try { list = await call('noticesList', { subjectId: S.subjectId }); }
  catch (e) { clear(box).append(emptyState('⚠️', e.message)); return; }
  clear(box);
  if (!list.length) { box.append(emptyState('📢', '아직 이 반의 공지가 없어요.')); return; }
  const seen = seenNotices();
  list.forEach(n => box.append(noticeCard(n, !isAdmin() && seen.indexOf(n.id) < 0, () => viewNotices(view))));
  if (!isAdmin()) {
    markNoticesSeen(list.map(n => n.id));
    const on = chips.querySelector('.chip.on .badge');
    if (on) on.remove();
  }
}

function noticeCard(n, isNew, refresh) {
  const card = el('div', { class: 'card notice-card' + (n.pinned ? ' pinned' : '') },
    el('div', { class: 'meta row wrap', style: 'gap:6px;margin-bottom:6px' },
      n.pinned ? el('span', { class: 'badge pri' }, '📌 고정') : null,
      !n.subjectId ? el('span', { class: 'badge mine' }, '전체 공지') : null,
      isNew ? el('span', { class: 'badge wait' }, 'NEW') : null,
      el('span', { class: 'small muted', style: 'margin-left:auto' }, shortDate(n.createdAt))),
    el('h3', null, n.title),
    n.content ? richText(n.content) : null);
  if (isAdmin()) {
    card.append(el('div', { class: 'admin-bar' },
      el('span', { class: 'small muted grow' }, n.updatedAt !== n.createdAt ? '수정 ' + shortDate(n.updatedAt) : ''),
      el('button', { class: 'btn line sm', onclick: () => noticeForm(n, refresh) }, '수정'),
      el('button', { class: 'btn danger sm', onclick: async e => {
        if (!(await confirmSheet('공지를 삭제할까요?', n.title, '삭제', true))) return;
        await busy(e.target, () => call('noticeDelete', { id: n.id }));
        toast('삭제했어요.'); refresh();
      } }, '삭제')));
  }
  return card;
}

function noticeForm(n, refresh) {
  n = n || {};
  const target = el('select', { class: 'input' },
    el('option', { value: '' }, '전체 (모든 반)'),
    S.subjects.map(s => el('option', { value: s.id }, s.name)));

  const close = openSheet(n.id ? '공지 수정' : '공지 쓰기', el('div', null,
    field('대상 반', target, '"전체"로 올리면 모든 반 학생에게 보여요.'),
    field('제목', title),
    field('내용', content),

/* =========================================================
 * 2. Zoom Clinic 탭
 * ======================================================= */
/* ---- Clinic 시간표 자동 새로고침 ----
 * 다른 학생이 먼저 신청한 시간이 내 화면에 빨리 반영되도록, Clinic 탭을 보고 있는 동안
 * CLINIC_POLL_MS 마다 최신 시간표를 받아 옵니다. (앱이 백그라운드이거나 입력창이 열려 있으면 쉼)
 * 실제 중복 예약은 서버 잠금으로 막히고, 여기서는 '마감된 칸을 누르는 일'을 줄여 줍니다. */
const CLINIC_POLL_MS = 15 * 1000;
let clinicPoll = null;
function stopClinicPoll() { if (clinicPoll) { clearInterval(clinicPoll.timer); clinicPoll = null; } }
function startClinicPoll(view, d) {
  stopClinicPoll();
  const poll = { last: JSON.stringify(d.days), busy: false };
  poll.tick = async () => {
    if (poll.busy || document.hidden || S.tab !== 'booking' || !view.isConnected || document.querySelector('.backdrop')) return;
    poll.busy = true;
    try {
      const nd = await call('bookingSlots');
      if (clinicPoll !== poll) return;
      const key = JSON.stringify(nd.days);
      if (key !== poll.last) { poll.last = key; viewBooking(view, nd); }
      else markUpdated(view);
    } catch (e) { /* 잠깐 끊겨도 다음 주기에 다시 시도 */ }
    finally { poll.busy = false; }
  };
  poll.timer = setInterval(poll.tick, CLINIC_POLL_MS);
  clinicPoll = poll;
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && clinicPoll) clinicPoll.tick(); });
function markUpdated(view) {
  const t = view.querySelector('.live-stamp');
  if (t) t.textContent = '실시간 반영 중 · ' + new Date().toTimeString().slice(0, 8) + ' 기준';
}

async function viewBooking(view, data) {
  let d = data;
  if (!d) {
    clear(view).append(loader());
    try { d = await call('bookingSlots'); }
    catch (e) { clear(view).append(emptyState('⚠️', e.message)); return; }
  }
  const scrollY = window.scrollY;
  clear(view);
  const refresh = nd => viewBooking(view, nd);
  startClinicPoll(view, d);
  const mine = [];
  d.days.forEach(day => day.slots.forEach(s => { if (s.mine) mine.push({ day, s }); }));

  const hero = el('div', { class: 'zoom-hero' },
    el('div', { class: 'zt' }, el('span', { class: 'cam' }, icon('video', 22)), isAdmin() ? 'Clinic 신청 현황' : '1:1 Zoom Clinic'),
    el('p', null,
      d.rule + ' · 1시간 단위로 신청해요.',
      d.cutoffHours ? ' 신청·취소는 시작 ' + d.cutoffHours + '시간 전까지 가능해요.' : '',
      d.maxPerWeek ? ' 한 주에 최대 ' + d.maxPerWeek + '시간까지 신청할 수 있어요.' : ''));
  if (d.zoomUrl && (isAdmin() || mine.length)) hero.append(zoomJoinButton(d.zoomUrl, 'btn zoom block'));
  if (d.zoomInfo && (isAdmin() || mine.length)) hero.append(el('div', { class: 'zoom-info pre' }, d.zoomInfo));
  if (isAdmin()) {
    if (!d.zoomUrl) hero.append(el('div', { class: 'zoom-info' }, '[설정] 시트의 "Zoom 링크"에 회의 주소를 넣으면 예약한 학생에게 입장 버튼이 보여요.'));
    if (d.sheetUrl) hero.append(el('a', { class: 'btn zoom sm', style: 'margin-top:12px;text-decoration:none', href: d.sheetUrl, target: '_blank', rel: 'noopener' }, '구글시트 시간표 열기 ↗'));
  }
  view.append(hero);

  if (!isAdmin()) {
    view.append(el('div', { class: 'section-title' }, '내 Clinic 일정'));
    view.append(el('div', { class: 'card' }, mine.length
      ? mine.map(({ day, s }) => el('div', { class: 'list-row' },
          el('span', { class: 'badge mine' }, '예약'),
          el('span', { class: 'grow', style: 'font-weight:600' }, day.label + ' ' + s.label),
          d.zoomUrl ? zoomJoinButton(d.zoomUrl, 'btn zoom-solid sm', '입장') : null))
      : el('div', { class: 'muted small' }, '아직 신청한 Clinic이 없어요. 아래에서 원하는 시간을 눌러 신청하세요.')));
  }

  view.append(el('div', { class: 'legend' },
    el('span', null, el('i', { style: 'background:var(--zoom-soft);border:1.5px solid rgba(11,92,255,.35)' }), '신청 가능'),
    isAdmin() ? null : el('span', null, el('i', { style: 'background:var(--zoom-grad)' }), '내 예약'),
    el('span', null, el('i', { style: 'background:var(--field);opacity:.7' }), '마감/지남')));

  view.append(el('div', { class: 'live-stamp small muted', style: 'margin:-6px 4px 6px' }, ''));
  markUpdated(view);
  if (data) requestAnimationFrame(() => window.scrollTo(0, scrollY));
  if (!d.days.length) view.append(emptyState('🗓️', '지금 신청할 수 있는 날짜가 없어요.'));
  let lastWeek = null;
  d.days.forEach(day => {
    if (day.week !== lastWeek) {
      lastWeek = day.week;
      view.append(el('div', { class: 'section-title' }, weekTitle(day.week)));
    }
    const grid = el('div', { class: 'slots' });
    day.slots.forEach(s => grid.append(isAdmin() ? adminSlot(day, s, refresh) : studentSlot(day, s, refresh)));
    const booked = day.slots.reduce((n, s) => n + s.count, 0);
    view.append(el('div', { class: 'card day' },
      el('h3', null, day.label, el('span', { class: 'small muted' }, isAdmin() ? '신청 ' + booked + '건' : '')), grid));
  });
}

function zoomJoinButton(url, cls, label) {
  return el('a', { class: cls, href: url, target: '_blank', rel: 'noopener', style: 'text-decoration:none' }, icon('video', 18), label || 'Zoom 입장하기');
}

function weekTitle(monday) {
  const today = todayYmd();
  const d = new Date(monday + 'T00:00:00Z');
  const thisMon = new Date(today + 'T00:00:00Z');
  thisMon.setUTCDate(thisMon.getUTCDate() - ((thisMon.getUTCDay() + 6) % 7));
  const diff = Math.round((d - thisMon) / (7 * 864e5));
  return diff === 0 ? '이번 주' : diff === 1 ? '다음 주' : diff + '주 뒤';
}

function studentSlot(day, s, refresh) {
  const full = s.count >= s.capacity;
  let cls = 'slot', sub;
  if (s.mine) { cls += ' mine'; sub = '✓ 내 예약'; }
  else if (!s.open) { cls += ' past'; sub = '마감'; }
  else if (full) { cls += ' full'; sub = '마감'; }
  else { cls += ' free'; sub = s.capacity > 1 ? '신청 (' + (s.capacity - s.count) + '자리)' : '신청 가능'; }
  return el('button', { class: cls, 'data-slot': day.date + ' ' + s.hour, onclick: () => {
    if (s.mine) return cancelMine(day, s, refresh);
    if (!s.open || full) return toast(s.open ? '이미 마감된 시간이에요.' : '신청 시간이 지났어요.');
    bookForm(day, s, refresh);
  } }, el('div', { class: 'h' }, s.hour + '시'), el('div', { class: 's' }, sub));
}

function bookForm(day, s, refresh) {
  const memo = input({ placeholder: '예: 3단원 문제풀이 질문 (선택)', maxlength: 200 });
  const myClasses = S.subjects;
  const clsSel = myClasses.length > 1 ? el('select', { class: 'input' }, myClasses.map(c => el('option', { value: c.id }, c.name))) : null;
  if (clsSel) clsSel.value = S.subjectId;
  const ok = el('button', { class: 'btn' }, '신청하기');
  const warn = el('div', { class: 'lock-note hidden', style: 'background:var(--warn-soft);color:var(--warn);font-weight:700' });
  const close = openSheet('Zoom Clinic 신청', el('div', null,
    warn,
    el('div', { class: 'card', style: 'background:var(--zoom-grad);color:#fff;box-shadow:none' },
      el('div', { style: 'font-size:18px;font-weight:800' }, day.label), el('div', null, s.label)),
    clsSel ? field('어느 반 Clinic인가요?', clsSel) : null,
    field('선생님께 남길 메모', memo, 'Clinic에서 다루고 싶은 내용을 적어두면 선생님이 미리 준비할 수 있어요.')),
    [el('button', { class: 'btn line', onclick: () => close() }, '취소'), ok]);
  // 폼을 여는 사이 다른 학생이 먼저 잡았는지 바로 확인
  call('bookingSlots').then(nd => {
    const now = (nd.days.find(x => x.date === day.date) || { slots: [] }).slots.find(x => x.hour === s.hour);
    if (now && !now.mine && (now.count >= now.capacity || !now.open)) {
      warn.textContent = '방금 다른 학생이 이 시간을 먼저 신청했어요. 다른 시간을 골라 주세요.';
      warn.classList.remove('hidden');
      ok.disabled = true;
    }
  }).catch(() => {});
  ok.addEventListener('click', () => busy(ok, async () => {
    const r = await call('bookingBook', { date: day.date, hour: s.hour, memo: memo.value, subjectId: clsSel ? clsSel.value : (myClasses[0] && myClasses[0].id) });
    close();
    refresh(r);
    if (r.ok) toast('Clinic 신청 완료! ' + day.label + ' ' + s.hour + '시');
    else bookingRejected(r.message);
  }).catch(() => { close(); refresh(); }));
}

function bookingRejected(message) {
  let close;
  close = openSheet('신청하지 못했어요', el('p', { class: 'muted', style: 'margin-top:0' }, message, el('br'), '시간표를 최신 상태로 바꿨어요.'),
    [el('button', { class: 'btn', onclick: () => close() }, '다른 시간 고르기')]);
}

async function cancelMine(day, s, refresh) {
  if (!s.open) return toast('취소 가능 시간이 지났어요. 선생님께 직접 말씀해 주세요.', true);
  if (!(await confirmSheet('예약을 취소할까요?', day.label + ' ' + s.label, '예약 취소', true))) return;
  const r = await busy(null, () => call('bookingCancel', { id: s.mine }));
  refresh(r);
  if (r.ok) toast('취소했어요.'); else toast(r.message, true);
}

function adminSlot(day, s, refresh) {
  const has = s.count > 0;
  return el('button', { class: 'slot' + (has ? ' admin-has' : (s.open ? '' : ' past')), onclick: () => {
    if (!has) return;
    const body = el('div', null, s.people.map(p => el('div', { class: 'list-row' },
      el('div', { class: 'grow' },
        p.className ? el('span', { class: 'badge pri', style: 'margin-bottom:4px' }, p.className) : null,
        el('div', { style: 'font-weight:700' }, p.name + ' ', el('span', { class: 'muted small' }, '(' + p.nickname + ')')),
        el('a', { class: 'small', href: 'tel:' + p.phone }, p.phone),
        p.memo ? el('div', { class: 'small muted' }, '메모: ' + p.memo) : null),
      el('button', { class: 'btn danger sm', onclick: async e => {
        if (!(await confirmSheet('이 예약을 취소할까요?', p.name + ' · ' + day.label + ' ' + s.label, '예약 취소', true))) return;
        const r = await busy(e.target, () => call('bookingCancel', { id: p.id }));
        close(); refresh(r);
        if (r.ok) toast('취소했어요.'); else toast(r.message, true);
      } }, '취소'))));
    const close = openSheet(day.label + ' ' + s.label, body, [el('button', { class: 'btn line', onclick: () => close() }, '닫기')]);
  } },
  el('div', { class: 'h' }, s.hour + '시'),
  has ? [el('div', { class: 'names' }, s.people.map(p => p.name).join(', ')),
    el('div', { class: 'cls' }, s.people.map(p => p.className || '').filter(Boolean).join(', '))] : el('div', { class: 's' }, s.open ? '비어 있음' : '지남'));
}

/* =========================================================
 * 3. 질문 탭 (과목별 익명 게시판 + FAQ)
 * ======================================================= */
function viewQna(view) {
  clear(view);
  view.append(subjectChips(() => viewQna(view)));
  if (!S.subjectId) return;
  view.append(el('div', { class: 'seg' },
    el('button', { class: S.qnaMode === 'board' ? 'on' : '', onclick: () => { S.qnaMode = 'board'; viewQna(view); } }, '질문 게시판'),
    el('button', { class: S.qnaMode === 'faq' ? 'on' : '', onclick: () => { S.qnaMode = 'faq'; viewQna(view); } }, '자주 묻는 질문')));
  const box = el('div', null, loader());
  view.append(box);
  (S.qnaMode === 'faq' ? drawFaq : drawBoard)(box, () => viewQna(view));
}

async function drawBoard(box, refresh) {
  let list;
  try { list = await call('questionsList', { subjectId: S.subjectId }); }
  catch (e) { clear(box).append(emptyState('⚠️', e.message)); return; }
  clear(box);

  const filters = isAdmin() ? [['all', '전체'], ['wait', '답변 대기']] : [['all', '전체'], ['wait', '답변 대기'], ['mine', '내 질문']];
  box.append(el('div', { class: 'row wrap', style: 'margin-bottom:10px' }, filters.map(([k, t]) =>
    el('button', { class: 'chip' + (S.qFilter === k ? ' on' : ''), style: 'padding:6px 12px;font-size:13px', onclick: () => { S.qFilter = k; refresh(); } },
      t + (k === 'wait' ? ' ' + list.filter(q => !q.answer).length : '')))));
  if (!isAdmin()) {
    box.append(el('div', { class: 'lock-note' }, icon('lock', 16), '질문은 익명으로 올라가요. 다른 학생은 누가 썼는지 알 수 없어요.'));
  }

  const shown = list.filter(q => S.qFilter === 'wait' ? !q.answer : S.qFilter === 'mine' ? q.mine : true);
  if (!shown.length) box.append(emptyState('💬', list.length ? '해당하는 질문이 없어요.' : '아직 질문이 없어요. 첫 질문을 남겨보세요!'));
  shown.forEach(q => box.append(questionCard(q, refresh)));

  if (!isAdmin()) box.append(el('button', { class: 'btn fab', onclick: () => questionForm(refresh) }, '✏️ 질문하기'));
}

function questionCard(q, refresh) {
  const body = el('div', { class: 'body hidden' });
  const card = el('div', { class: 'card q' },
    el('div', { class: 'meta' },
      q.answer ? el('span', { class: 'badge ok' }, '답변 완료') : el('span', { class: 'badge wait' }, '답변 대기'),
      q.mine ? el('span', { class: 'badge mine' }, '내 질문') : null,
      q.inFaq ? el('span', { class: 'badge pri' }, 'FAQ') : null,
      q.asker ? el('span', { class: 'small muted' }, q.asker) : null,
      el('span', { class: 'date' }, shortDate(q.createdAt))),
    el('h3', null, q.title),
    body);
  card.addEventListener('click', e => {
    if (e.target.closest('button, a, textarea, input')) return;
    body.classList.toggle('hidden');
  });

  body.append(richText(q.content));
  if (q.answer && !isAdmin()) {
    body.append(el('div', { class: 'answer' }, el('div', { class: 'who-a' }, '선생님 답변 · ' + shortDate(q.answeredAt)), richText(q.answer)));
  }
  if (isAdmin()) {
    const ta = textarea({ placeholder: '답변을 입력하세요', value: q.answer || '' });
    const save = el('button', { class: 'btn sm' }, q.answer ? '답변 수정' : '답변 등록');
    save.addEventListener('click', () => busy(save, async () => {
      await call('questionAnswer', { id: q.id, answer: ta.value });
      toast('답변을 저장했어요.');
      if (!q.answer && ta.value.trim()) S.unanswered = Math.max(0, S.unanswered - 1);
      renderMain();
    }));
    body.append(el('div', { class: 'answer' }, el('div', { class: 'who-a' }, '내 답변'), ta,
      el('div', { class: 'row', style: 'margin-top:8px;justify-content:flex-end;gap:6px' },
        q.inFaq ? null : el('button', { class: 'btn line sm', onclick: e => busy(e.target, async () => {
          if (!ta.value.trim() && !q.answer) throw new Error('답변을 먼저 등록해 주세요.');
          await call('faqFromQuestion', { id: q.id }); toast('FAQ에 등록했어요. FAQ 탭에서 다듬을 수 있어요.'); refresh();
        }) }, 'FAQ로 등록'),
        el('button', { class: 'btn danger sm', onclick: async e => {
          if (!(await confirmSheet('질문을 삭제할까요?', q.title, '삭제', true))) return;
          await busy(e.target, () => call('questionDelete', { id: q.id }));
          if (!q.answer) S.unanswered = Math.max(0, S.unanswered - 1);
          toast('삭제했어요.'); renderMain();
        } }, '삭제'),
        save)));
  } else if (q.mine && !q.answer) {
    body.append(el('div', { class: 'row', style: 'justify-content:flex-end;margin-top:10px' },
      el('button', { class: 'btn danger sm', onclick: async e => {
        if (!(await confirmSheet('내 질문을 삭제할까요?', q.title, '삭제', true))) return;
        await busy(e.target, () => call('questionDelete', { id: q.id }));
        toast('삭제했어요.'); refresh();
      } }, '삭제')));
  }
  return card;
}

function questionForm(refresh) {
  const sub = S.subjects.find(s => s.id === S.subjectId);
  const title = input({ placeholder: '한 줄 요약', maxlength: 100 });
  const content = textarea({ placeholder: '궁금한 내용을 자세히 적어 주세요. (교재 쪽수, 문제 번호 등)' });
  const ok = el('button', { class: 'btn' }, '익명으로 올리기');
  const close = openSheet('질문하기', el('div', null,
    el('div', { class: 'small muted', style: 'margin:-8px 0 12px' }, sub ? sub.name : ''),
    field('제목', title), field('내용', content),
    el('div', { class: 'lock-note' }, icon('lock', 16), '닉네임도 표시되지 않는 익명 질문이에요.')),
    [el('button', { class: 'btn line', onclick: () => close() }, '취소'), ok]);
  ok.addEventListener('click', () => busy(ok, async () => {
    await call('questionCreate', { subjectId: S.subjectId, title: title.value, content: content.value });
    close(); toast('질문을 올렸어요. 답변이 달리면 여기서 확인할 수 있어요.');
    S.qFilter = 'all'; refresh();
  }));
}

async function drawFaq(box, refresh) {
  let list;
  try { list = await call('faqList', { subjectId: S.subjectId }); }
  catch (e) { clear(box).append(emptyState('⚠️', e.message)); return; }
  clear(box);
  if (isAdmin()) box.append(el('button', { class: 'btn ghost block', style: 'margin-bottom:12px', onclick: () => faqForm(null, refresh) }, '+ FAQ 직접 추가'));
  else box.append(el('p', { class: 'small muted', style: 'margin:0 4px 10px' }, '이 과목에서 다른 학생들이 자주 했던 질문과 답변이에요.'));
  if (!list.length) { box.append(emptyState('🙋', '아직 정리된 FAQ가 없어요.')); return; }
  list.forEach((f, i) => {
    box.append(el('details', { class: 'card faq-item' },
      el('summary', null, el('span', { class: 'qmark' }, 'Q' + (i + 1)), el('span', { class: 'pre grow' }, f.question)),
      el('div', { class: 'a' }, el('span', { class: 'amark' }, 'A'), el('div', { class: 'grow' }, f.answer ? richText(f.answer) : el('span', { class: 'muted' }, '(답변 준비 중)'))),
      isAdmin() ? el('div', { class: 'admin-bar' },
        el('button', { class: 'btn line sm', onclick: () => faqForm(f, refresh) }, '수정'),
        el('button', { class: 'btn danger sm', onclick: async e => {
          if (!(await confirmSheet('FAQ를 삭제할까요?', f.question, '삭제', true))) return;
          await busy(e.target, () => call('faqDelete', { id: f.id }));
          toast('삭제했어요.'); refresh();
        } }, '삭제')) : null));
  });
}

function faqForm(f, refresh) {
  f = f || {};
  const q = textarea({ value: f.question || '', style: 'min-height:80px' });
  const a = textarea({ value: f.answer || '' });
  const ok = el('button', { class: 'btn' }, '저장');
  const close = openSheet(f.id ? 'FAQ 수정' : 'FAQ 추가', el('div', null, field('질문', q), field('답변', a)),
    [el('button', { class: 'btn line', onclick: () => close() }, '취소'), ok]);
  ok.addEventListener('click', () => busy(ok, async () => {
    await call('faqSave', { id: f.id, subjectId: S.subjectId, question: q.value, answer: a.value });
    close(); toast('저장했어요.'); refresh();
  }));
}

/* =========================================================
 * 4. 내 정보 (학생)
 * ======================================================= */
async function viewMe(view) {
  clear(view).append(loader());
  let d;
  try { d = await call('myInfo'); }
  catch (e) { clear(view).append(emptyState('⚠️', e.message)); return; }
  clear(view);
  view.append(el('div', { class: 'card' },
    el('div', { class: 'profile-head' },
      el('div', { class: 'big-avatar' }, d.nickname.charAt(0)),
      el('div', null, el('h3', { style: 'margin:0;font-size:19px' }, d.nickname), el('div', { class: 'small muted' }, '다른 학생에게는 닉네임만 보여요.'))),
    el('dl', { class: 'kv' },
      el('dt', null, '이름'), el('dd', null, d.name),
      el('dt', null, '휴대폰'), el('dd', null, d.phone),
      el('dt', null, '가입일'), el('dd', null, String(d.createdAt).slice(0, 10))),
    el('div', { class: 'lock-note', style: 'margin:14px 0 0' }, icon('lock', 16), '이름과 휴대폰 번호는 나와 선생님만 볼 수 있어요.')));

  view.append(el('div', { class: 'section-title' }, '다가오는 Zoom Clinic'));
  view.append(el('div', { class: 'card' }, d.bookings.length
    ? d.bookings.map(b => el('div', { class: 'list-row' }, el('span', { class: 'badge mine' }, '예약'), el('span', { class: 'grow', style: 'font-weight:600' }, b.label),
        d.zoomUrl ? zoomJoinButton(d.zoomUrl, 'btn zoom-solid sm', '입장') : null))
    : el('div', { class: 'small muted' }, '예약된 Zoom Clinic이 없어요.')));

  view.append(el('div', { class: 'section-title' }, '계정'));
  view.append(el('div', { class: 'card' },
    el('button', { class: 'btn line block', style: 'margin-bottom:8px', onclick: passwordForm }, '비밀번호 바꾸기'),
    el('button', { class: 'btn danger block', onclick: () => logout() }, '로그아웃')));
}

function passwordForm() {
  const cur = input({ type: 'password', autocomplete: 'current-password' });
  const nw = input({ type: 'password', autocomplete: 'new-password', placeholder: '4자 이상' });
  const ok = el('button', { class: 'btn' }, '바꾸기');
  const close = openSheet('비밀번호 바꾸기', el('div', null, field('현재 비밀번호', cur), field('새 비밀번호', nw)),
    [el('button', { class: 'btn line', onclick: () => close() }, '취소'), ok]);
  ok.addEventListener('click', () => busy(ok, async () => {
    const d = await call('changePassword', { current: cur.value, next: nw.value });
    S.token = d.token; saveStore({ token: d.token });
    close(); toast('비밀번호를 바꿨어요.');
  }));
}

/* =========================================================
 * 5. 관리 (선생님)
 * ======================================================= */
function viewAdmin(view) {
  clear(view);

  // 과목 관리
  view.append(el('div', { class: 'section-title' }, el('span', { class: 'grow' }, '과목 관리'),
    el('button', { class: 'btn ghost sm', onclick: () => subjectForm(null, () => viewAdmin(view)) }, '+ 과목 추가')));
  const subCard = el('div', { class: 'card' });
  view.append(subCard);
  if (!S.subjects.length) subCard.append(el('div', { class: 'muted small' }, '과목이 없어요.'));
  S.subjects.forEach((s, i) => {
    const move = dir => e => busy(e.currentTarget, async () => { S.subjects = await call('subjectMove', { id: s.id, dir }); viewAdmin(view); });
    subCard.append(el('div', { class: 'list-row' },
      el('div', { class: 'grow' }, el('div', { style: 'font-weight:700' + (s.active ? '' : ';color:var(--muted);text-decoration:line-through') }, s.name),
        s.active ? null : el('div', { class: 'small muted' }, '학생에게 숨겨짐')),
      el('button', { class: 'icon-btn', title: '위로', disabled: i === 0, onclick: move(-1) }, icon('up', 18)),
      el('button', { class: 'icon-btn', title: '아래로', disabled: i === S.subjects.length - 1, onclick: move(1) }, icon('down', 18)),
      el('button', { class: 'icon-btn', title: '이름 바꾸기', onclick: () => subjectForm(s, () => viewAdmin(view)) }, icon('edit', 18))));
  });
  view.append(el('p', { class: 'small muted', style: 'margin:-4px 4px 0' }, '과목명을 바꿔도 수업·질문·FAQ는 그대로 이어져요. 끝난 과목은 숨기면 학생 화면에서 사라져요.'));

  // 학생 목록
  view.append(el('div', { class: 'section-title' }, '학생 목록 (선생님만 볼 수 있음)'));
  const stuCard = el('div', { class: 'card' }, loader());
  view.append(stuCard);
  loadStudents(stuCard);

  // 바로가기
  view.append(el('div', { class: 'section-title' }, '바로가기'));
  view.append(el('div', { class: 'card' },
    S.sheetUrl ? el('a', { class: 'btn ghost block', style: 'text-decoration:none;margin-bottom:8px', href: S.sheetUrl, target: '_blank', rel: 'noopener' }, '구글 스프레드시트 열기 ↗') : null,
    el('p', { class: 'small muted', style: 'margin:0 0 10px' }, '앱 이름, Zoom 링크, Clinic 요일·시간·정원, 선생님 비밀번호, 알림 이메일은 스프레드시트의 [설정] 시트에서 바꿀 수 있어요.'),
    el('button', { class: 'btn danger block', onclick: () => logout() }, '로그아웃')));
}

function subjectForm(s, refresh) {
  s = s || {};
  const name = input({ value: s.name || '', placeholder: '예: 겨울특강 물리학 개념(월금)', maxlength: 60 });
  const ok = el('button', { class: 'btn' }, '저장');
  const actions = [el('button', { class: 'btn line', onclick: () => close() }, '취소'), ok];
  const body = el('div', null, field('과목명', name));
  if (s.id) {
    body.append(el('button', { class: 'btn ' + (s.active ? 'danger' : 'ghost') + ' block', onclick: e => busy(e.target, async () => {
      S.subjects = await call('subjectSetActive', { id: s.id, active: !s.active });
      close(); toast(s.active ? '학생 화면에서 숨겼어요.' : '다시 보이게 했어요.'); refresh();
    }) }, s.active ? '학생에게 숨기기' : '다시 보이기'));
  }
  const close = openSheet(s.id ? '과목 수정' : '과목 추가', body, actions);
  ok.addEventListener('click', () => busy(ok, async () => {
    S.subjects = await call('subjectSave', { id: s.id, name: name.value });
    if (!S.subjectId && S.subjects[0]) S.subjectId = S.subjects[0].id;
    close(); toast('저장했어요.'); refresh();
  }));
}

async function loadStudents(card) {
  let list;
  try { list = await call('studentsList'); }
  catch (e) { clear(card).append(el('div', { class: 'muted' }, e.message)); return; }
  clear(card);
  const q = input({ placeholder: '이름·닉네임·번호 검색', type: 'search', style: 'margin-bottom:6px' });
  const rows = el('div');
  card.append(el('div', { class: 'small muted', style: 'margin-bottom:8px' }, '총 ' + list.length + '명'), q, rows);
  const draw = () => {
    clear(rows);
    const k = q.value.trim().toLowerCase();
    const shown = list.filter(u => !k || (u.name + u.nickname + u.phone).toLowerCase().indexOf(k) >= 0);
    if (!shown.length) rows.append(el('div', { class: 'muted small', style: 'padding:10px 0' }, '학생이 없어요.'));
    shown.forEach(u => rows.append(el('div', { class: 'list-row' },
      el('div', { class: 'grow' },
        el('div', { style: 'font-weight:700' }, u.name, ' ', el('span', { class: 'muted small' }, '· ' + u.nickname)),
        el('div', { class: 'row wrap', style: 'gap:4px;margin:2px 0' }, (u.classIds || []).length
          ? u.classIds.map(id => { const c = S.subjects.find(x => x.id === id); return c ? el('span', { class: 'badge pri' }, c.name) : null; })
          : el('span', { class: 'badge wait' }, '반 없음')),
        el('a', { class: 'small', href: 'tel:' + u.phone }, u.phone),
        el('span', { class: 'small muted' }, ' · Clinic ' + u.bookings + '회')),
      el('button', { class: 'btn line sm', onclick: () => studentMenu(u, () => loadStudents(card)) }, '관리'))));
  };
  q.addEventListener('input', draw);
  draw();
}

function studentMenu(u, refresh) {
  const body = el('div', null,
    el('dl', { class: 'kv', style: 'margin-bottom:16px' },
      el('dt', null, '닉네임'), el('dd', null, u.nickname),
      el('dt', null, '이름'), el('dd', null, u.name),
      el('dt', null, '휴대폰'), el('dd', null, u.phone),
      el('dt', null, '가입일'), el('dd', null, String(u.createdAt).slice(0, 10))),
    (() => {
      const chooser = classChooser(S.subjects, u.classIds);
      const save = el('button', { class: 'btn ghost sm', style: 'margin-top:10px' }, '반 저장');
      save.addEventListener('click', () => busy(save, async () => {
        await call('studentSetClasses', { id: u.id, classIds: chooser.value() });
        close(); toast('반을 바꿨어요.'); refresh();
      }));
      return el('div', { class: 'field', style: 'margin-bottom:16px' }, el('label', null, '반'), chooser, save);
    })(),
    el('button', { class: 'btn line block', style: 'margin-bottom:8px', onclick: async e => {
      if (!(await confirmSheet('비밀번호를 초기화할까요?', u.name + ' 학생의 비밀번호가 임시 번호로 바뀌어요.', '초기화'))) return;
      const d = await busy(e.target, () => call('studentResetPassword', { id: u.id }));
      close();
      openSheet('임시 비밀번호', el('div', null,
        el('p', null, u.name + '(' + u.nickname + ') 학생에게 알려주세요.'),
        el('div', { style: 'font-size:34px;font-weight:900;letter-spacing:6px;text-align:center;padding:12px;background:var(--primary-soft);border-radius:12px' }, d.tempPassword),
        el('p', { class: 'small muted' }, '로그인 후 [내 정보 → 비밀번호 바꾸기]에서 바꾸도록 안내해 주세요.')));
    } }, '비밀번호 초기화'),
    el('button', { class: 'btn danger block', onclick: async e => {
      if (!(await confirmSheet('학생 계정을 삭제할까요?', u.name + '(' + u.nickname + ')\n앞으로 잡힌 Zoom Clinic 예약도 함께 취소돼요. 되돌릴 수 없어요.', '삭제', true))) return;
      await busy(e.target, () => call('studentDelete', { id: u.id }));
      close(); toast('삭제했어요.'); refresh();
    } }, '계정 삭제'));
  const close = openSheet(u.name + ' 학생', body, [el('button', { class: 'btn line', onclick: () => close() }, '닫기')]);
}

start();
</script>
</body>
</html>
